name: Mobile build

on:
  push:
    branches: [android-app]
    paths: ['mobile/**', '.github/workflows/mobile-build.yml']
  workflow_dispatch:

jobs:
  dsp-tests:
    name: Native DSP tests (host)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build and run DSP tests
        working-directory: mobile/native/test
        run: |
          g++ -O2 -std=c++17 -Wall -I.. chain_test.cpp -o chain_test
          ./chain_test

  apk:
    name: Debug APK
    runs-on: ubuntu-latest
    needs: dsp-tests
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npx jest
      - name: Accept Android SDK licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
      - name: Build debug APK
        working-directory: mobile/android
        run: ./gradlew assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: gemstar-debug-apk
          path: mobile/android/app/build/outputs/apk/debug/*.apk

  ios:
    name: iOS build (simulator, unsigned)
    runs-on: macos-latest
    needs: dsp-tests
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - run: npm ci
      - name: Install pods
        working-directory: mobile/ios
        run: pod install
      - name: Build for iOS Simulator
        working-directory: mobile/ios
        run: |
          xcodebuild -workspace Gemstar.xcworkspace -scheme Gemstar \
            -configuration Debug -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO build | tail -40
          exit ${PIPESTATUS[0]}
