name: Android build

on:
  push:
    branches: [android-app]
    paths: ['android-app/**', '.github/workflows/android-build.yml']
  workflow_dispatch:

jobs:
  dsp-tests:
    name: Native DSP tests (host)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build and run DSP tests
        working-directory: android-app/android/gemstar-audio/src/main/cpp/test
        run: |
          g++ -O2 -std=c++17 -Wall -I../dsp chain_test.cpp -o chain_test
          ./chain_test

  apk:
    name: Debug APK
    runs-on: ubuntu-latest
    needs: dsp-tests
    defaults:
      run:
        working-directory: android-app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: android-app/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npx jest
      - name: Accept Android SDK licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
      - name: Build debug APK
        working-directory: android-app/android
        run: ./gradlew assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: gemstar-debug-apk
          path: android-app/android/app/build/outputs/apk/debug/*.apk
